<!DOCTYPE html>
<html>
<head>

<body>

<style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", sans-serif;
      font-weight: 600;
      background: white;
    }

    .page {
      min-height: 100vh;
    }


    .cover {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
      --radius: 350px;
    }

   
    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      animation: spin 10s linear infinite;
    }

    .ring span {
      position: absolute;
      top: 0;
      left: 0;
      font-size: clamp(120px, 5vw, 160px);
      font-weight: 700;
      white-space: pre;
      transform:
        translate(-50%, -50%)
        rotate(var(--angle))
        translateY(calc(0px - var(--radius)));
    }

    
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

   
    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: black;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

  
    .image-page {
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      overflow: hidden;
    }

    .image-page img {
      display: block;
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
    }

    .hidden {
      display: none;
    }



    #nextPage {
  cursor: pointer;
}

#taskEntryPage {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 500px;

}

#taskEntryRing {

}

#taskEntryRing span {

.task-controls {

}

#innerBackgroundCircle {

}

/* 빨간 원을 중심으로 도는 캐릭터 */

}

#runnerPosition {
  position: absolute;

#runnerOrbit.running {
  animation: runnerClockwise var(--runner-duration, 8s) steps(8, end) infinite;
}

#runnerOrbit.paused {

}

@keyframes runnerClockwise {

/* 가운데 빨간 원 */

height: var(--outer-circle-size, min(96vmin, 1155px));

  <script>
    
    const phrase = "인간챗바퀴" ;

    
    const characters = Array.from(phrase.repeat(2));
    const ring = document.getElementById("ring");

    characters.forEach((character, index) => {
      const letter = document.createElement("span");
      const angle = (360 / characters.length) * index;

      letter.textContent = character;
      letter.style.setProperty("--angle", angle + "deg");

      ring.appendChild(letter);
    });

   
 document.getElementById("cover").addEventListener("click", () => {
  document.getElementById("cover").classList.add("hidden");
  document.getElementById("taskEntryPage").classList.remove("hidden");
});

    const manualPageForInput = document.getElementById("nextPage");
const taskEntryPage = document.getElementById("taskEntryPage");
const taskTextInput = document.getElementById("text");
const taskEntryRing = document.getElementById("taskEntryRing");



function updateTaskRing(text, fontSize = 130, fontWeight = 600) {
  taskEntryRing.innerHTML = "";

  const phrase = text.trim();
  if (phrase === "") return;

  const innerRadius = Math.min(window.innerWidth, window.innerHeight) * 0.33;
  const radius = innerRadius + fontSize * 0.55;

  const repeatedPhrase = phrase + " ";
  const phraseLetters = Array.from(repeatedPhrase);

  const targetCount = Math.ceil((2 * Math.PI * radius) / fontSize);
  const repeatCount = Math.max(
    1,
    Math.ceil(targetCount / phraseLetters.length)
  );

  const letters = Array.from(repeatedPhrase.repeat(repeatCount));

  taskEntryRing.style.setProperty("--radius", radius + "px");
  taskEntryRing.style.setProperty("--font-size", fontSize + "px");

  letters.forEach((letter, index) => {
    const span = document.createElement("span");
    const angle = (360 / letters.length) * index;

    span.textContent = letter;
    span.style.setProperty("--angle", angle + "deg");
    span.style.fontWeight = fontWeight;

    taskEntryRing.appendChild(span);
  });
}

taskTextInput.addEventListener("input", () => {
  updateTaskRing(taskTextInput.value);
});

const confirmInputButton = document.getElementById("ok");
const taskInputControls = document.querySelector("#taskEntryPage .task-controls");
const innerBackgroundCircle = document.getElementById("innerBackgroundCircle");
const runnerOrbit = document.getElementById("runnerOrbit");
const movementSpeedSlider =
  document.getElementById("movementSpeedSlider");
let movementSpeed = Number(movementSpeedSlider.value) || 1;

movementSpeedSlider.addEventListener("input", () => {
  movementSpeed = Number(movementSpeedSlider.value);
  runnerOrbit.style.setProperty(
    "--runner-duration",
    `${8 / movementSpeed}s`
  );
});
const timerStartButton = document.getElementById("timerStart");
const settingBoxes = document.getElementById("settingBoxes");


confirmInputButton.addEventListener("click", () => {
  const enteredText = document.getElementById("text").value.trim();

  if (enteredText === "") {
    document.getElementById("text").focus();
    return;
  }

  taskInputControls.classList.add("hidden");
  innerBackgroundCircle.classList.remove("hidden");
  runnerOrbit.classList.remove("hidden");
  timerStartButton.classList.remove("hidden");
  settingBoxes.classList.remove("hidden");

  const innerRadius = Math.min(
    window.innerWidth,
    window.innerHeight
  ) * 0.33;

  innerBackgroundCircle.style.width = innerRadius * 2 + "px";
  innerBackgroundCircle.style.height = innerRadius * 2 + "px";

  updateTimerDisplay();
});


const minutesInput = document.getElementById("minutesInput");
const secondsInput = document.getElementById("secondsInput");
const timerDisplay = document.getElementById("timerDisplay");

let remainingSeconds = 0;
let countdownInterval = null;

function formatTimer(seconds) {
  const minutes = Math.floor(seconds / 60);
  const leftSeconds = seconds % 60;

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(leftSeconds).padStart(2, "0")
  );
}

function updateTimerDisplay() {
  const minutes = Math.max(0, Number(minutesInput.value) || 0);
  const seconds = Math.min(
    59,
    Math.max(0, Number(secondsInput.value) || 0)
  );

  secondsInput.value = seconds;
  remainingSeconds = minutes * 60 + seconds;
  timerDisplay.textContent = formatTimer(remainingSeconds);
}

minutesInput.addEventListener("input", updateTimerDisplay);
secondsInput.addEventListener("input", updateTimerDisplay);


timerStartButton.addEventListener("click", () => {
  const isResume = runnerOrbit.classList.contains("paused");

 if (countdownInterval !== null) {
  clearInterval(countdownInterval);
  countdownInterval = null;
  runnerOrbit.classList.add("paused");
  timerStartButton.classList.remove("urgent");
  return;
}

runnerOrbit.classList.remove("paused");

  if (!isResume) {
  updateTimerDisplay();
}

  if (remainingSeconds <= 0) {
    alert("작업 시간을 설정해줘!");
    return;
  }

  minutesInput.disabled = true;
  secondsInput.disabled = true;
  runnerOrbit.classList.add("running");

  countdownInterval = setInterval(() => {
    remainingSeconds = Math.max(0, remainingSeconds - movementSpeed);
    timerDisplay.textContent = formatTimer(remainingSeconds);

    if (remainingSeconds > 0 && remainingSeconds <= 30) {
      const blinkSpeed = Math.max(0.18, remainingSeconds / 30);

      timerStartButton.style.setProperty(
        "--blink-speed",
        blinkSpeed + "s"
      );
      timerStartButton.classList.add("urgent");
    }

    if (remainingSeconds === 0) {
      clearInterval(countdownInterval);
      countdownInterval = null;
      runnerOrbit.classList.remove("running", "paused");
      timerStartButton.classList.remove("urgent");
      timerStartButton.disabled = true;
    }
  }, 1000);
});
minutesInput.addEventListener("input", () => {
  timerStartButton.classList.add("time-ready");
});

secondsInput.addEventListener("input", () => {
  timerStartButton.classList.add("time-ready");
});


document.getElementById("innerColor").addEventListener("input", (event) => {
  innerBackgroundCircle.style.backgroundColor = event.target.value;
});


document.getElementById("outerColor").addEventListener("input", (event) => {
  document.getElementById("taskEntryPage").style.backgroundColor =
    event.target.value;
});


const characterImages = [
  { src: "hamster.png", alt: "햄스터" },
  { src: "worker.png", alt: "직장인" },
  { src: "student.png", alt: "학생" },
  { src: "person.png", alt: "사람" }
];

let currentCharacter = 0;

document.getElementById("runnerImage").addEventListener("click", () => {
  currentCharacter = (currentCharacter + 1) % characterImages.length;

  const image = document.getElementById("runnerImage");
  image.src = characterImages[currentCharacter].src;
  image.alt = characterImages[currentCharacter].alt;
});

(() => {
  const display = document.getElementById("timerDisplay");
  const editor = document.getElementById("timeSetting");
  const minutes = document.getElementById("minutesInput");
  const seconds = document.getElementById("secondsInput");
  const saveButton = document.getElementById("saveTimeButton");

  display.addEventListener("click", () => {
    display.classList.add("hidden");
    editor.classList.remove("hidden");
    minutes.focus();
  });

  saveButton.addEventListener("click", () => {
    minutes.value = Math.max(0, parseInt(minutes.value, 10) || 0);
    seconds.value = Math.min(59, Math.max(0, parseInt(seconds.value, 10) || 0));

    updateTimerDisplay();

    editor.classList.add("hidden");
    display.classList.remove("hidden");
  });
})();

(() => {
  const slider = document.getElementById("textSizeSlider");
  const ring = document.getElementById("taskEntryRing");
  const innerCircle = document.getElementById("innerBackgroundCircle");
  const page = document.getElementById("taskEntryPage");

  let baseSize;
  let baseWeight;
  let baseOuterCircleSize;

  slider.addEventListener("input", () => {
    const letters = ring.querySelectorAll("span");
    if (letters.length === 0) return;

    if (baseSize === undefined) {
      const style = getComputedStyle(letters[0]);
      baseSize = parseFloat(style.fontSize);
      baseWeight = parseInt(style.fontWeight, 10) || 600;
      baseOuterCircleSize =
  parseFloat(getComputedStyle(page, "::before").width) ||
  Math.min(Math.min(window.innerWidth, window.innerHeight) * 1, 1155);
    }

    const position = Number(slider.value) / 100;
    const runner = document.getElementById("runnerImage");
runner.style.scale = 0.8 + position * 0.8;
runner.style.transformOrigin = "50% 0%";
    const minSize = baseSize * 0.2;
    const maxSize = baseSize * 10;

  

    let size;
    let weight;

    if (position <= 0.5) {
      const amount = position / 0.5;
      size = minSize + (baseSize - minSize) * amount;
      weight = 300 + (baseWeight - 300) * amount;
    } else {
      const amount = (position - 0.5) / 0.5;
      size = baseSize + (maxSize - baseSize) * amount;
      weight = baseWeight + (800 - baseWeight) * amount;
    }

   const innerCircleSize =
  innerCircle.getBoundingClientRect().width || 180;
const minOuterCircleSize = innerCircleSize + 48;

let outerCircleSize;

if (position <= 0.5) {
  const circleAmount = position / 0.5;
  outerCircleSize =
    minOuterCircleSize +
    (baseOuterCircleSize - minOuterCircleSize) * circleAmount;
} else {
  const circleAmount = (position - 0.5) / 0.5;
  outerCircleSize =
    baseOuterCircleSize +
    baseOuterCircleSize * 9 * circleAmount;
}

page.style.setProperty("--outer-circle-size", `${outerCircleSize}px`);

    const taskText = document.getElementById("text").value;
updateTaskRing(taskText, size, Math.round(weight));
  });
})();
document.getElementById("ok").addEventListener("click", function () {
  document.getElementById("textSizeControl").classList.remove("hidden");
});
const characterGuideHint = document.getElementById("characterGuideHint");
const timerGuideHint = document.getElementById("timerGuideHint");
const startGuideHint = document.getElementById("startGuideHint");
const guideRunnerImage = document.getElementById("runnerImage");
const guideOkButton = document.getElementById("ok");

function placeGuideHint(hint, target) {
  const rect = target.getBoundingClientRect();

  const left = Math.max(
    8,
    Math.min(rect.right - 10, window.innerWidth - hint.offsetWidth - 8)
  );

  hint.style.left = `${left}px`;
  hint.style.top = `${rect.top + rect.height / 2 - 30 }px`;
}
function placeTimerGuideHint(hint, target) {
  const rect = target.getBoundingClientRect();
  const left = Math.max(8, rect.left - hint.offsetWidth - 12);

  hint.style.left = `${left}px`;
  hint.style.top = `${rect.top + rect.height / 2}px`;
}
function placeStartGuideHint(hint, target) {
  const rect = target.getBoundingClientRect();

  const left = Math.min(
    window.innerWidth - hint.offsetWidth - 8,
    rect.right + 12
  );

  hint.style.left = `${Math.max(8, left)}px`;
  hint.style.top = `${rect.top + rect.height / 2 - hint.offsetHeight / 2 + 17 }px`;
}
function updateGuidePositions() {
  if (characterGuideHint.classList.contains("show")) {
    placeGuideHint(characterGuideHint, guideRunnerImage);
  }

  if (timerGuideHint.classList.contains("show")) {
    placeTimerGuideHint(timerGuideHint, timerDisplay);
  }

  if (
  characterGuideHint.classList.contains("show") ||
  timerGuideHint.classList.contains("show") ||
  startGuideHint.classList.contains("show")
) {
    requestAnimationFrame(updateGuidePositions);
  }
  if (startGuideHint.classList.contains("show")) {
  placeStartGuideHint(startGuideHint, timerStartButton);
}
}

guideOkButton.addEventListener("click", () => {
  if (!guideRunnerImage.getClientRects().length) return;

  characterGuideHint.classList.add("show");
  timerGuideHint.classList.add("show");
  startGuideHint.classList.add("show");
  updateGuidePositions();
});


guideRunnerImage.addEventListener("click", () => {
  characterGuideHint.classList.remove("show");
});


[timerDisplay, minutesInput, secondsInput].forEach((item) => {
  item.addEventListener("click", () => {
    timerGuideHint.classList.remove("show");
  });
 
timerStartButton.addEventListener("click", () => {
  startGuideHint.classList.remove("show");
});
});
  </script>
</body>
</html>
